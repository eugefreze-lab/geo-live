<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Просмотр геолокации в реальном времени">
    <title>Гео-трансляция — Просмотр</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
    <div class="container viewer-container">
        <header class="viewer-header">
            <h1>📍 Трансляция геолокации</h1>
            <div id="connection-status" class="connection-status offline">
                <span class="status-dot"></span>
                <span id="status-text">Подключение...</span>
            </div>
        </header>

        <main>
            <div id="map" class="map-container"></div>

            <div id="info-panel" class="info-panel hidden">
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Точность (радиус)</span>
                        <span id="view-accuracy" class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Последнее обновление</span>
                        <span id="view-last-update" class="info-value">—</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Статус</span>
                        <span id="view-status" class="info-value offline">Офлайн</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Координаты</span>
                        <span id="view-coordinates" class="info-value">—</span>
                    </div>
                </div>
                <button id="center-btn" class="btn btn-primary btn-full">Центрировать на маркере</button>
            </div>

            <div id="waiting-panel" class="waiting-panel">
                <div class="waiting-content">
                    <div class="spinner"></div>
                    <h2>Ожидание трансляции...</h2>
                    <p id="waiting-message">Ожидание координат от транслятора...</p>
                    <p class="session-id">Сессия: <strong id="session-id-display">—</strong></p>
                </div>
            </div>

            <div id="error-panel" class="error-panel hidden">
                <h2>Ошибка</h2>
                <p id="error-message">Не удалось загрузить трансляцию</p>
                <a href="./index.html" class="btn btn-primary">На главную</a>
            </div>
        </main>

        <footer class="viewer-footer">
            <p>Данные обновляются в реальном времени через <a href="https://supabase.com" target="_blank">Supabase Realtime</a></p>
        </footer>
    </div>

    <script type="module" src="./config.js"></script>
    <script type="module" src="./viewer.js"></script>
</body>
</html>
